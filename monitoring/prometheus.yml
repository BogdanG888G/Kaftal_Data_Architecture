global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Сам Prometheus — уже работает
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Метрики хоста (диск, CPU, RAM) — ГЛАВНОЕ для мониторинга диска
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Метрики контейнеров (CPU, RAM каждого контейнера)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ClickHouse — порт 9363, НЕ 9009
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']

  - job_name: 'clickhouse-exporter'
    static_configs:
      - targets: ['clickhouse-exporter:9116']